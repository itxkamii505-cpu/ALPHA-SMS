<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA SMS | Login</title>
<link rel="icon" type="image/svg+xml" href="/static/img/alphasms-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
(function(){
  try {
    var s = window.__BRAND_SETTINGS__;
    if (!s) {
      var c = localStorage.getItem('app_brand_settings');
      if (c) s = JSON.parse(c);
    }
    if (s && s.site_name) {
      document.title = s.site_name + ' | Login';
    }
  } catch(e) {}
})();
</script>
<script src="/static/js/brand-theme.js"></script>
<script src="/static/js/speed-auth-guard.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #241917;
  background-image: radial-gradient(circle at 50% 25%, #3d2a27 0%, #201514 100%);
  color: #111827;
  padding: 20px 14px;
  position: relative;
  overflow-x: hidden;
}

/* ── Centered Card Matching Screenshot ── */
.login-card {
  width: 100%;
  max-width: 410px;
  background: #ffffff;
  border-radius: 28px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  padding: 44px 34px 38px;
  animation: cardFadeIn 0.35s ease both;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Logo Box (Supports Circular & Wide Logos) ── */
.brand-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  min-height: 85px;
}
.brand-logo-img {
  max-width: 260px;
  max-height: 95px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  transition: all 0.2s ease;
}
.brand-logo-img.is-circle {
  width: 92px;
  height: 92px;
  max-width: 92px;
  max-height: 92px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  background: #ffffff;
}

/* ── Clean Subtitle from Screenshot ── */
.login-sub {
  font-size: 16px;
  font-weight: 700;
  color: #111827;
  text-align: center;
  margin-top: 14px;
  margin-bottom: 24px;
  letter-spacing: -0.2px;
}

/* ── Error Box ── */
.login-err {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 18px;
  text-align: center;
}

/* ── Pill Input Fields from Screenshot ── */
.pill-input-wrap {
  position: relative;
  background: #eaedf1;
  border-radius: 9999px;
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  margin-bottom: 16px;
  border: 1.5px solid transparent;
  transition: all 0.2s ease;
}
.pill-input-wrap:focus-within {
  background: #f1f4f8;
  border-color: #cbd5e1;
  box-shadow: 0 0 0 3px rgba(72, 187, 38, 0.15);
}
.pill-icon {
  color: #64748b;
  font-size: 16px;
  margin-right: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  flex-shrink: 0;
}
.pill-input-wrap input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  color: #111827;
  outline: none;
}
.pill-input-wrap input::placeholder {
  color: #8c9ba5;
  font-weight: 500;
}
.eye-toggle {
  background: transparent;
  border: none;
  color: #8c9ba5;
  font-size: 15px;
  cursor: pointer;
  padding: 6px;
  margin-left: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s;
}
.eye-toggle:hover {
  color: #334155;
}

/* ── Inline Captcha from Screenshot ── */
.captcha-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  margin-bottom: 24px;
  padding-left: 6px;
  user-select: none;
  flex-wrap: wrap;
}
.captcha-question {
  font-size: 15px;
  font-weight: 600;
  color: #111827;
  letter-spacing: -0.2px;
}
.captcha-box-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.captcha-input {
  width: 110px;
  height: 38px;
  background: #ffffff;
  border: 1.5px solid #4a5568;
  border-radius: 8px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: #111827;
  text-align: left;
  outline: none;
  transition: all 0.2s ease;
}
.captcha-input:focus {
  border-color: #48bb26;
  box-shadow: 0 0 0 2px rgba(72, 187, 38, 0.2);
}
.captcha-input::placeholder {
  color: #94a3b8;
  font-weight: 400;
  font-style: italic;
}
.captcha-reload {
  background: transparent;
  border: none;
  color: #64748b;
  font-size: 14px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.2s ease;
}
.captcha-reload:hover {
  color: #111827;
  transform: rotate(45deg);
}

/* ── Vibrant Green LOGIN Pill Button from Screenshot ── */
.login-btn-green {
  width: 100%;
  height: 52px;
  border-radius: 9999px;
  border: none;
  background: #48bb26;
  color: #ffffff;
  font-family: inherit;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(72, 187, 38, 0.28);
  transition: all 0.2s ease;
}
.login-btn-green:hover {
  background: #3ea81e;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(72, 187, 38, 0.38);
}
.login-btn-green:active {
  transform: translateY(0);
}
.login-btn-green:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

@media (max-width: 440px) {
  .login-card {
    padding: 34px 22px 30px;
    border-radius: 22px;
  }
}
</style>
</head>
<body>

<main class="login-card">
  <!-- Brand Logo -->
  <div class="brand-logo-wrap">
    <img id="login-logo-img" class="brand-logo-img" src="/static/img/alphasms-logo.svg" onerror="this.onerror=null;this.src='/static/img/custom-logo.png';" alt="ALPHA SMS">
  </div>

  <!-- Subtitle matching user screenshot -->
  <div class="login-sub">Please sign in to continue.</div>

  <!-- Error Notification -->
  <div id="errorMsg" class="login-err" style="display:none;"></div>

  <!-- Login Form -->
  <form id="loginForm" novalidate>
    <!-- Username -->
    <div class="pill-input-wrap">
      <i class="fas fa-envelope pill-icon"></i>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
    </div>

    <!-- Password -->
    <div class="pill-input-wrap">
      <i class="fas fa-lock pill-icon"></i>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="eye-toggle" id="togglePassword" aria-label="Toggle password visibility">
        <i class="far fa-eye" id="eyeIcon"></i>
      </button>
    </div>

    <!-- Inline Math Captcha -->
    <div class="captcha-container">
      <span class="captcha-question" id="captchaQuestion">What is 12 + 5 =</span>
      <div class="captcha-box-wrap">
        <input type="number" id="captchaInput" class="captcha-input" placeholder="Answer" autocomplete="off" required>
        <button type="button" class="captcha-reload" id="reloadCaptcha" title="Change Question" aria-label="Refresh Captcha">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </div>

    <!-- Green LOGIN Button -->
    <button type="submit" class="login-btn-green" id="submitBtn">LOGIN</button>
  </form>
</main>

<script>
// Synchronous instant brand load (zero lag / zero flash)
function applyBrandUI(s) {
  if (!s) return;
  const name = s.site_name || 'ALPHA SMS';
  document.title = name + ' | Login';
  if (s.logo_url) {
    const logoEl = document.getElementById('login-logo-img');
    if (logoEl) {
      logoEl.src = s.logo_url;
      const checkRatio = function() {
        const nw = logoEl.naturalWidth || 1;
        const nh = logoEl.naturalHeight || 1;
        const ratio = nw / nh;
        const isCircle = (ratio >= 0.75 && ratio <= 1.3) || s.logo_url.includes('circle') || s.logo_url.includes('round') || s.logo_url.includes('mark');
        if (isCircle) {
          logoEl.classList.add('is-circle');
        } else {
          logoEl.classList.remove('is-circle');
        }
      };
      if (logoEl.complete) checkRatio();
      else logoEl.onload = checkRatio;
    }
  }
}

// 1. Apply immediately from window.__BRAND_SETTINGS__ or localStorage (0ms delay)
try {
  const instant = window.__BRAND_SETTINGS__ || JSON.parse(localStorage.getItem('app_brand_settings') || '{}');
  if (instant && Object.keys(instant).length) applyBrandUI(instant);
} catch (e) {}

// 2. Refresh silently in background if needed
(async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    if (res.ok) {
      const s = await res.json();
      if (s) applyBrandUI(s);
    }
  } catch (_) {}
})();

// Math Captcha Logic
let captchaAnswer = 0;
function generateCaptcha() {
  const n1 = Math.floor(Math.random() * 12) + 1;
  const n2 = Math.floor(Math.random() * 12) + 1;
  captchaAnswer = n1 + n2;
  const qEl = document.getElementById('captchaQuestion');
  if (qEl) qEl.textContent = 'What is ' + n1 + ' + ' + n2 + ' =';
  const inp = document.getElementById('captchaInput');
  if (inp) inp.value = '';
}
const reloadBtn = document.getElementById('reloadCaptcha');
if (reloadBtn) reloadBtn.addEventListener('click', generateCaptcha);
generateCaptcha();

const loginForm = document.getElementById('loginForm');
const username = document.getElementById('username');
const password = document.getElementById('password');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');
const togglePassword = document.getElementById('togglePassword');
const eyeIcon = document.getElementById('eyeIcon');

togglePassword.addEventListener('click', () => {
  const hidden = password.type === 'password';
  password.type = hidden ? 'text' : 'password';
  if (eyeIcon) {
    eyeIcon.className = hidden ? 'far fa-eye-slash' : 'far fa-eye';
  }
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
}
function hideError() {
  errorMsg.textContent = '';
  errorMsg.style.display = 'none';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();

  const u = username.value.trim();
  const p = password.value.trim();

  if (!u) {
    showError('Please enter your username');
    username.focus();
    return;
  }
  if (!p) {
    showError('Please enter your password');
    password.focus();
    return;
  }

  const captchaInp = document.getElementById('captchaInput');
  const userAns = parseInt((captchaInp ? captchaInp.value : '').trim(), 10);
  if (isNaN(userAns) || userAns !== captchaAnswer) {
    showError('Incorrect captcha answer. Please try again.');
    generateCaptcha();
    if (captchaInp) captchaInp.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'LOGGING IN...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      showError(data.error || data.detail || 'Invalid username or password');
      submitBtn.disabled = false;
      submitBtn.textContent = 'LOGIN';
      return;
    }

    const userObj = data.user || {
      id: data.id || 1,
      username: data.username || u,
      role: data.role || 'Owner'
    };

    if (window.SpeedAuth) {
      window.SpeedAuth.setSession(userObj, data.token);
      const targetUrl = window.SpeedAuth.getRoleRedirect(userObj.role);
      window.location.replace(targetUrl);
    } else {
      sessionStorage.setItem('admin_logged_in', '1');
      sessionStorage.setItem('admin_user', JSON.stringify(userObj));
      localStorage.setItem('admin_logged_in', '1');
      localStorage.setItem('admin_user', JSON.stringify(userObj));
      localStorage.setItem('active_session_active', '1');
      localStorage.setItem('active_session_role', userObj.role || 'Owner');

      const role = (userObj.role || data.role || '').toLowerCase();
      if (role === 'testpanel') {
        window.location.href = '/testpanel';
      } else if (role === 'client' || role === 'reseller') {
        window.location.href = '/ints/client/SMSDashboard';
      } else if (role === 'manager') {
        window.location.href = '/ints/manager/SMSDashboard';
      } else if (role === 'agent') {
        window.location.href = '/ints/agent/SMSDashboard';
      } else {
        window.location.href = '/owner';
      }
    }
  } catch (err) {
    showError('Network error. Please try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'LOGIN';
  }
});
</script>

</body>
</html>
