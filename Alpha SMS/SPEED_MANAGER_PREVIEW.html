<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA SMS — Manager Panel (Design Preview)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.modal{background:#fff;border-radius:6px;width:min(440px,92vw);overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;}
.modal-header h3{margin:0;font-size:15px;}
.modal-header button{background:none;border:none;cursor:pointer;font-size:16px;color:#fff;}
.modal-body{padding:14px;}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:9px 14px;border-radius:4px;border:1px solid transparent;font-size:14px;cursor:pointer;}
.btn-primary{background:#78B800;color:#fff;}
.btn-outline{background:linear-gradient(#fff,#ececec);border:1px solid #c8c8c8;color:#333;}
body{margin:0;}
</style>
<style>/* ══════════════════════════════════════════════════════════════
   ALPHA SMS — Manager Panel skin
   Loaded AFTER style.css. Everything here is scoped to body.rmsui
   ══════════════════════════════════════════════════════════════ */

body.rmsui {
  --zy-blue-top:    #78B800;
  --zy-blue-bot:    #4D7A00;
  --zy-blue:        #659A00;
  --zy-blue-dark:   #355400;
  --zy-sub:         #8ecbeb;
  --zy-line:        #d5d5d5;
  --zy-panel-head:  #f2f2f2;
  --zy-text:        #333;

  background: #fff !important;
  color: var(--zy-text) !important;
  font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif !important;
  font-size: 12px; line-height: 18px; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.rmsui * { box-sizing: border-box; }
body.rmsui a { color: #5E9800; text-decoration: none; }

/* ── Desktop left sidebar ─────────────────────────────────────── */
.zy-side {
  position: fixed; top: 0; left: 0; bottom: 0; width: 230px; z-index: 60;
  background: #fff; border-right: 1px solid #cfcfcf; overflow-y: auto;
}
.zy-side-head {
  background: #ececec; padding: 18px 10px 14px; text-align: center;
  border-bottom: 1px solid #cfcfcf;
}
.zy-avatar-lg {
  width: 86px; height: 86px; border-radius: 50%; margin: 0 auto 10px;
  background: radial-gradient(circle at 35% 30%, #fdfdfd, #d8d8d8 70%, #c4c4c4);
  border: 1px solid #c8c8c8; display: flex; align-items: center; justify-content: center;
  overflow: hidden; box-shadow: inset 0 1px 2px rgba(255,255,255,.9);
}
.zy-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
.zy-welcome { font-size: 12px; color: #444; }
.zy-role    { font-size: 13px; font-weight: 700; color: #222; margin-top: 2px; }
.zy-clock   { font-size: 11px; color: #666; margin-top: 3px; }

.zy-sidenav { padding-bottom: 30px; }
.zy-sidenav .zy-snav {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 11px 10px; color: #fff; font-size: 11.5px; font-weight: 700;
  letter-spacing: .3px; text-transform: uppercase;
  background: linear-gradient(#00699f, #527F00);
  border-bottom: 1px solid #355400;
}
.zy-sidenav .zy-snav:hover, .zy-sidenav .zy-snav.active { background: linear-gradient(#527F00, #355400); }
.zy-sidenav .zy-snav .zy-ic { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
.zy-sidenav .zy-snav .zy-ic .zy-icimg { width: 16px; height: 16px; object-fit: contain; display: block; }
.zy-sidenav .zy-snav .zy-caret { margin-left: auto; font-size: 10px; opacity: .85; }
.zy-sidenav .zy-ssub { display: none; background: #f4f4f4; border-bottom: 1px solid #ddd; }
.zy-sidenav .zy-ssub.open { display: block; }
.zy-sidenav .zy-ssub div {
  padding: 8px 12px 8px 34px; font-size: 12px; color: #527F00; cursor: pointer;
  border-bottom: 1px solid #e6e6e6;
}
.zy-sidenav .zy-ssub div:hover { background: #f0ffd9; }
.zy-side-foot { height: 26px; background: #2b2b2b; }

/* ── Main column ──────────────────────────────────────────────── */
.zy-main { margin-left: 230px; min-height: 100vh; background: #f9f9f9; }

/* ── Blue header ──────────────────────────────────────────────── */
.zy-header {
  background: linear-gradient(180deg, #78B800 0%, #005c90 60%, #2B4300 100%);
  color: #fff; position: relative;
}
.zy-header-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; min-height: 62px; gap: 12px;
}
.zy-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.zy-logo svg { height: 40px; width: auto; display: block; }
.zy-logo-img {
  height: 42px; width: 42px; object-fit: cover; border-radius: 6px;
  background: #fff; padding: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.zy-head-right { display: flex; align-items: center; gap: 14px; position: relative; }
.zy-hamb {
  width: 46px; height: 34px; border-radius: 4px; background: #f2f2f2;
  border: 1px solid #c9c9c9; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 0;
}
.zy-hamb span { display: block; width: 24px; height: 2px; background: #6b6b6b; border-radius: 2px; }
.zy-hamb:hover { background: #e6e6e6; }
.zy-user {
  display: flex; align-items: center; gap: 7px; cursor: pointer;
  font-size: 15px; color: #fff; white-space: nowrap;
}
.zy-user .zy-ava {
  width: 26px; height: 26px; border-radius: 50%; background: #e9e9e9; color: #4a4a4a;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.zy-user .fa-caret-down { font-size: 12px; }
.zy-dot { width: 7px; height: 7px; border-radius: 2px; background: #ff5a1f; }

.zy-user-menu {
  display: none; position: absolute; right: 0; top: 44px; width: 200px; z-index: 90;
  background: #fff; border: 1px solid #ccc; border-radius: 4px; overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,.22);
}
.zy-user-menu.open { display: block; }
.zy-user-menu .zy-um-head {
  background: linear-gradient(180deg, var(--zy-blue-top), var(--zy-blue-bot));
  color: #fff; padding: 10px 12px; font-size: 13px; font-weight: 700;
}
.zy-user-menu a {
  display: flex; align-items: center; gap: 9px; padding: 10px 12px;
  font-size: 13px; color: #333; border-top: 1px solid #eee; cursor: pointer;
}
.zy-user-menu a:hover { background: #f2ffd9; }

/* ── Mega menu (inline blue) ──────────────────────────────────── */
.zy-mega { display: none; padding: 4px 14px 16px; }
.zy-mega.open { display: block; }
@media (min-width: 992px) {
  .zy-mega { column-count: 3; column-gap: 26px; }
  .zy-mega .zy-mblock { break-inside: avoid; margin-bottom: 6px; }
}
.zy-mblock { margin-bottom: 4px; }
.zy-mtop {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  color: #fff; font-size: 12px; font-weight: 700; padding: 9px 2px;
}
.zy-mtop:hover { color: #d9f0ff; }
.zy-mtop .zy-mi {
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
}
.zy-mtop .zy-mi .zy-icimg { width: 19px; height: 19px; object-fit: contain; display: block; }
.zy-ph-ic { display: inline-flex; align-items: center; }
.zy-ph-ic .zy-icimg { width: 19px; height: 19px; object-fit: contain; display: block; }
.zy-msub div {
  padding: 3px 2px 3px 26px; font-size: 12px; color: var(--zy-sub); cursor: pointer;
}
.zy-msub div::before { content: "○ "; font-size: 9px; margin-right: 4px; vertical-align: 2px; }
.zy-msub div:hover { color: #fff; }

/* ── Body / breadcrumb ────────────────────────────────────────── */
.zy-body { padding: 14px 20px; }
.zy-crumb {
  background: linear-gradient(#f1f1f1, #dbdbdb); border: 1px solid #c2c2c2; border-radius: 4px;
  padding: 4px 14px; font-size: 11px; line-height: 18px; color: #333; margin-bottom: 18px;
}
.zy-crumb a { color: #5E9800; }
.zy-crumb .zy-sep { color: #999; margin: 0 6px; }

body.rmsui .page-content { padding: 0 !important; max-width: none !important; }

/* ── Dashboard glossy tiles ───────────────────────────────────── */
.zy-tiles { display: grid; grid-template-columns: 1fr; gap: 22px; margin-bottom: 22px; }
@media (min-width: 768px)  { .zy-tiles { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1200px) { .zy-tiles { grid-template-columns: repeat(5, 1fr); } }
.zy-tile {
  background: linear-gradient(180deg, #fefefe 0%, #f6f6f6 55%, #ebebeb 100%);
  border: 1px solid #dcdcdc; border-radius: 3px; padding: 14px 8px;
  text-align: center; cursor: pointer;
  box-shadow: 0 0 5px rgba(0,0,0,.07);
}
.zy-tile:hover { background: linear-gradient(180deg,#fff,#eaeaea); border-color: #c8c8c8; }
.zy-tile .zy-tileimg { display: block; margin: 0 auto 9px; height: 30px; width: auto; }
.zy-tile span { font-size: 12px; color: #444; }

/* ── Panels (cards) ───────────────────────────────────────────── */
.zy-panel {
  background: #fff; border: 1px solid #c2c2c2; border-radius: 3px;
  margin-bottom: 20px; overflow: hidden;
  box-shadow: inset 0 1px 0 #f9f9f9;
}
.zy-panel-head {
  background: linear-gradient(180deg, #f1f1f1, #dbdbdb);
  border-bottom: 1px solid #c2c2c2; padding: 0 10px; height: 40px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: #333; letter-spacing: 0;
  text-transform: uppercase;
}
.zy-panel-head .zy-ph-btn {
  margin-left: auto; width: 34px; height: 34px; border: 1px solid #ccc;
  background: linear-gradient(#fff, #ececec); border-radius: 3px; color: #444;
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.zy-panel-body { padding: 10px; background: #fff; box-shadow: inset 0 0 5px #ddd; }
.zy-chart-title { text-align: center; font-size: 16px; color: #3a3a3a; padding: 16px 0 4px; }
.zy-chart-box { padding: 4px 8px 14px; height: 315px; }
.zy-section-title {
  font-size: 14px; font-weight: 700; color: #333; margin: 8px 0 6px;
}

/* ── DataTable look ───────────────────────────────────────────── */
.zy-pager { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; padding: 10px 0 14px; }
.zy-pager button {
  background: linear-gradient(180deg, #dcdcdc, #bebebe); border: 1px solid #a9a9a9;
  border-radius: 3px; padding: 4px 10px; font-size: 12px; color: #333; cursor: pointer;
}
.zy-pager button:hover:not(:disabled) { background: linear-gradient(180deg,#e6e6e6,#c6c6c6); }
.zy-pager button.on { background: linear-gradient(180deg,#c9c9c9,#ababab); font-weight: 400; }
.zy-pager button:disabled { color: #aaa; cursor: default; }

.zy-dt-wrap { overflow-x: auto; }
table.zy-dt { width: 100%; border-collapse: collapse; font-size: 12px; }
table.zy-dt th {
  text-align: left; padding: 8px; font-weight: 700; color: #333;
  border: 1px solid #ddd; white-space: nowrap; cursor: pointer; position: relative;
}
table.zy-dt th .zy-sort { float: right; margin-left: 10px; color: #9a9a9a; font-size: 11px; }
table.zy-dt th.sorted .zy-sort { color: #1a6fb0; }
table.zy-dt td {
  padding: 8px; border: 1px solid #ddd; color: #333; vertical-align: middle; line-height: 18px;
}
table.zy-dt tbody tr:nth-child(odd)  td.sorted,
table.zy-dt tbody tr:nth-child(odd)  td.zy-cbcol { background: #ebebeb; }
table.zy-dt tbody tr:nth-child(even) td.sorted,
table.zy-dt tbody tr:nth-child(even) td.zy-cbcol { background: #f6f6f6; }
table.zy-dt tbody tr:hover td { background: #f0f7fc; }
table.zy-dt .zy-empty { text-align: center; color: #999; padding: 26px 10px; }

.zy-badge-active {
  display: inline-block; background: #3a87ad; color: #fff; font-size: 11px;
  font-weight: 700; padding: 2px 7px; border-radius: 3px; white-space: nowrap;
}
.zy-badge-off { background: #999; }
.zy-gear {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px;
  background: linear-gradient(#fff, #ececec); border: 1px solid #c8c8c8;
  border-radius: 3px; color: #444; font-size: 13px; cursor: pointer;
}
.zy-gear:hover { background: linear-gradient(#fff, #ddd); }


/* ── Re-skin the shared components used by other manager pages ── */
body.rmsui .card {
  background: #fff !important; border: 1px solid #ddd !important;
  border-radius: 4px !important; box-shadow: none !important;
}
body.rmsui .card-header {
  background: linear-gradient(180deg,#fafafa,#ececec); margin: -16px -16px 14px;
  padding: 12px 14px; border-bottom: 1px solid #ddd;
}
body.rmsui .card-title { text-transform: uppercase; font-size: 13.5px; letter-spacing: .3px; color: #333; }
body.rmsui .btn-primary { background: #78B800 !important; border-color: #78B800 !important; }
body.rmsui .btn-primary:hover { background: #095980 !important; }
body.rmsui .btn-outline { background: linear-gradient(#fff,#ececec) !important; border: 1px solid #c8c8c8 !important; color: #333 !important; }
body.rmsui .badge { border-radius: 3px; }
body.rmsui .table-wrap { border: 1px solid #e5e5e5; border-radius: 4px; }
body.rmsui .table-wrap th { background: #f7f7f7; color: #222; }
body.rmsui .page-title { color: #333; }
body.rmsui .stat-card { background: #fff !important; border: 1px solid #ddd !important; }
body.rmsui .modal { background: #fff; }
body.rmsui .modal-header { background: linear-gradient(180deg, var(--zy-blue-top), var(--zy-blue-bot)); color: #fff; }
body.rmsui .modal-header h3 { color: #fff; }
body.rmsui .modal-header button { color: #fff; }

/* ── Mobile ───────────────────────────────────────────────────── */
@media (max-width: 991px) {
  html, body { max-width: 100vw !important; overflow-x: hidden !important; width: 100% !important; }
  .zy-side {
    position: fixed !important; top: 0 !important; left: 0 !important; bottom: 0 !important;
    width: 280px !important; max-width: 85vw !important; z-index: 99999 !important;
    transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
    display: block !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch !important;
  }
  body.sidebar-open .zy-side, .zy-side.open {
    transform: translateX(0) !important; box-shadow: 8px 0 32px rgba(0, 0, 0, 0.55) !important;
  }
  .zy-main {
    margin-left: 0 !important; width: 100% !important; max-width: 100vw !important;
    overflow-x: hidden !important; box-sizing: border-box !important;
  }
  .zy-logo svg { height: 34px; }
  .zy-logo-img { height: 36px; width: 36px; }
  .zy-header-row { flex-direction: row !important; align-items: center !important; justify-content: space-between !important; padding: 10px 14px !important; gap: 8px !important; }
  .zy-logo { justify-content: flex-start; }
  .zy-head-right { justify-content: flex-end; }
  .zy-hamb { width: 44px; height: 34px; display: flex !important; }
  .zy-user { font-size: 14px; }
  .zy-mega { padding: 2px 14px 18px; }
  .zy-body {
    padding: 12px 10px !important; width: 100% !important; max-width: 100vw !important;
    box-sizing: border-box !important; overflow-x: hidden !important;
  }
  .zy-crumb { font-size: 11px; }
  .zy-chart-box { height: 315px; }
  table.zy-dt, table.zy-dt2-table, .table-wrap, .table-responsive {
    font-size: 12px; width: 100% !important; max-width: 100% !important;
    display: block !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch !important;
  }
  .two-col, .three-col, .settings-two-col {
    display: flex !important; flex-direction: column !important; width: 100% !important;
    max-width: 100% !important; box-sizing: border-box !important; gap: 14px !important;
  }
}

/* ══════════════════════════════════════════════════════════════
   Inner pages — same look as the reference manager panel
   ══════════════════════════════════════════════════════════════ */
body.rmsui .zy-intro { font-size: 12px; color: #333; line-height: 18px; margin: 0 2px 18px; }
body.rmsui .zy-loading { padding: 22px; text-align: center; color: #888; }
body.rmsui .zy-panel-strip { height: 26px; background: #f4f4f4; border-bottom: 1px solid #e4e4e4; }

/* panel header action buttons */
.zy-head-acts { margin-left: auto; display: flex; align-items: stretch; gap: 0; margin-right: -12px; }
.zy-head-acts .zy-s2 { align-self: center; margin-right: 10px; }
.zy-act {
  width: 33px; border: none; cursor: pointer; color: #fff; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 0; align-self: stretch; margin: 0; min-height: 40px;
}
.zy-act img { width: 15px; height: 15px; object-fit: contain; }
.zy-act-blue { background: #78B800; } .zy-act-blue:hover { background: #4D7A00; }
.zy-act-red  { background: #d24842; } .zy-act-red:hover  { background: #bd3a35; }
.zy-act-teal { background: #2fa8bf; } .zy-act-teal:hover { background: #2793a8; }
.zy-act-export {
  margin: 0 -10px 0 auto; padding: 0 15px; align-self: stretch; min-height: 40px;
  border-radius: 0; border: none; cursor: pointer;
  background: #78B800; color: #fff; font-size: 12px; font-weight: 400; display: flex;
  align-items: center; gap: 7px; text-transform: none;
}
.zy-act-export img { width: 13px; height: 16px; object-fit: contain; }
.zy-act-export:hover { background: #4D7A00; }
.zy-range-pick {
  width: 157px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 3px;
  font-size: 14px; color: #555; margin: -6px 0;
}

/* filter bar under a panel header */
.zy-filterbar {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px 30px;
  background: #ececec; border-bottom: 1px solid #ddd;
}
.zy-filterbar select, .zy-filterbar input {
  padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px;
  color: #555; background: #fff; width: 100%; min-width: 0;
}
.zy-filterbar > button { justify-self: start; }
@media (min-width: 992px) { .zy-filterbar { grid-template-columns: repeat(4, 1fr); padding-bottom: 12px; } }
.zy-btn-red    { background: #d24842; color: #fff; border: none; border-radius: 3px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.zy-btn-blue   { background: #78B800; color: #fff; border: none; border-radius: 3px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.zy-btn-orange { background: #f9a228; color: #fff; border: none; border-radius: 3px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.zy-btn-grey   { background: #fafafa; color: #333; border: 1px solid #cccccc; border-radius: 3px; padding: 4px 14px; font-size: 13px; cursor: pointer; }
.zy-btn-red:hover { background: #bd3a35; } .zy-btn-blue:hover { background: #4D7A00; }
.zy-btn-orange:hover { background: #e8901a; } .zy-btn-grey:hover { background: #efefef; }
.zy-btn-wide { padding: 12px 34px; }
.zy-center { text-align: center; padding: 14px 0 4px; }

/* DataTable toolbar */
.zy-dt2-top { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: flex-start; }
.zy-search label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
.zy-search input {
  width: 200px; max-width: 100%; padding: 5px 2px 5px 25px; border-color: #d8d8d8; color: #444; font-size: 12px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 15px; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><circle cx='7' cy='7' r='5' fill='none' stroke='%233a7fbf' stroke-width='2'/><line x1='11' y1='11' x2='15' y2='15' stroke='%233a7fbf' stroke-width='2'/></svg>") 9px 50% no-repeat;
}
.zy-show { text-align: right; }
.zy-show select { padding: 4px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; width: 80px; background: #fff; }
.zy-show-lbl { font-size: 12px; font-weight: 700; color: #333; margin-top: 5px; }
.zy-exp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 6px; }
.zy-exp button {
  background: #f6f6f6; border: 1px solid #cfcfcf; border-radius: 3px;
  padding: 4px 10px; font-size: 13px; color: #333; cursor: pointer;
}
.zy-exp button:hover { background: #eaeaea; }
.zy-exp .zy-cols { margin-left: auto; padding: 6px 10px; }
.zy-dt2-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding-top: 6px; }
.zy-info { font-size: 15px; color: #444; }
.zy-dt2-foot .zy-pager { padding: 6px 0; justify-content: flex-end; }
table.zy-dt2-table th, table.zy-dt2-table td { white-space: nowrap; }
table.zy-dt2-table td { vertical-align: top; }
.zy-cbcol { width: 44px; text-align: center; }
.zy-cbcol input { width: 18px; height: 18px; }
.zy-tick { width: 19px; height: 19px; object-fit: contain; vertical-align: -3px; }

function loadPage(page){
  var c = document.getElementById('page-content');
  if (page === 'dashboard') { pgDashboard(); return; }
  var d = DEMO_PAGES[page];
  if (!d) {
    c.innerHTML = '<div class="zy-panel"><div class="zy-panel-head">' + page.replace(/-/g,' ') + '</div>'
      + '<div class="zy-panel-body" style="padding:34px;text-align:center;color:#777;">Design preview</div></div>';
    return;
  }
  var rows = d.rows.map(function(r){
    return r.map(function(v){
      if (v === 'GEAR') return { v:'', h:'<button class="zy-gear"><i class="fas fa-gear"></i><i class="fas fa-caret-down"></i></button>' };
      if (v === 'ACTIVE')   return { v:'active',   h:'<span class="zy-badge-active">Active</span>' };
      if (v === 'INACTIVE') return { v:'inactive', h:'<span class="zy-badge-active zy-badge-off">Inactive</span>' };
      if (v === 'FREE')     return { v:'free',     h:'<span class="zy-badge-active" style="background:#5a9e5a">Free</span>' };
      if (v === 'PENDING')  return { v:'pending',  h:'<span class="zy-badge-active" style="background:#d69b3a">Pending</span>' };
      return { v:v, h:v };
    });
  });
  var addBtn = d.add ? '<button class="zy-ph-btn" title="' + d.add + '"><i class="fas fa-plus"></i></button>' : '';
  c.innerHTML = '<div class="zy-panel"><div class="zy-panel-head">' + d.title + addBtn + '</div>'
    + '<div class="zy-panel-body">' + zyTable('zy-demo', d.head, rows, 6) + '</div></div>';
  zyRender('zy-demo');
}

/* ── DataTable (ALPHA SMS / DataTables look) ────────────────────── */
const ZYT = {};
function zyTable(id, headers, rows, perPage) {
  ZYT[id] = { headers, rows, perPage: perPage || 5, sort: 0, dir: 1, page: 1 };
  return `<div id="${id}"></div>`;
}
function zySort(id, col) {
  const t = ZYT[id]; if (!t) return;
  if (t.sort === col) t.dir = -t.dir; else { t.sort = col; t.dir = 1; }
  t.page = 1; zyRender(id);
}
function zyPage(id, p) {
  const t = ZYT[id]; if (!t) return;
  const max = Math.max(1, Math.ceil(t.rows.length / t.perPage));
  t.page = Math.min(Math.max(1, p), max); zyRender(id);
}
function zyCell(c) { return (c && typeof c === 'object') ? c : { v: c, h: c }; }
function zyRender(id) {
  const t = ZYT[id], host = document.getElementById(id);
  if (!t || !host) return;

  const rows = t.rows.slice().sort((a, b) => {
    const x = zyCell(a[t.sort]).v, y = zyCell(b[t.sort]).v;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * t.dir;
    return String(x ?? '').localeCompare(String(y ?? ''), undefined, { numeric: true }) * t.dir;
  });

  const total = Math.max(1, Math.ceil(rows.length / t.perPage));
  const page = Math.min(t.page, total);
  const slice = rows.slice((page - 1) * t.perPage, page * t.perPage);

  const nums = [];
  for (let i = 1; i <= Math.min(total, 4); i++) nums.push(i);

  const pager = `<div class="zy-pager">
    <button ${page === 1 ? 'disabled' : ''} onclick="zyPage('${id}',1)">First</button>
    <button ${page === 1 ? 'disabled' : ''} onclick="zyPage('${id}',${page - 1})">Previous</button>
    ${nums.map(n => `<button class="${n === page ? 'on' : ''}" onclick="zyPage('${id}',${n})">${n}</button>`).join('')}
    <button ${page === total ? 'disabled' : ''} onclick="zyPage('${id}',${page + 1})">Next</button>
    <button ${page === total ? 'disabled' : ''} onclick="zyPage('${id}',${total})">Last</button>
  </div>`;

  const head = t.headers.map((h, i) => {
    const on = i === t.sort;
    const ic = (typeof zySortIc === 'function')
      ? zySortIc(on, t.dir)
      : `<span class="zy-sort">${on ? (t.dir === 1 ? '▲' : '▼') : '⇅'}</span>`;
    return `<th class="${on ? 'sorted' : ''}" onclick="zySort('${id}',${i})">${h}${ic}</th>`;
  }).join('');

  const body = slice.length
    ? slice.map(r => `<tr>${r.map((c, i) => {
        const cell = zyCell(c);
        return `<td class="${i === t.sort ? 'sorted' : ''}">${cell.h ?? ''}</td>`;
      }).join('')}</tr>`).join('')
    : `<tr><td class="zy-empty" colspan="${t.headers.length}">No data available in table</td></tr>`;

  host.innerHTML = `${pager}<div class="zy-dt-wrap"><table class="zy-dt">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ── week chart, drawn on the canvas (no CDN needed) ────────── */
function zyLineChart(id, labels, values) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const data = (values || []).map(v => Number(v) || 0);
  const draw = () => {
    const box = cv.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const W = Math.max(240, box.width), H = Math.max(180, box.height);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);

    const L = 46, R = 14, T = 14, B = 34;
    const w = W - L - R, h = H - T - B;
    const peak = Math.max(1, ...data);
    let step = Math.ceil(peak / 5); if (step < 1) step = 1;
    const top = step * 5;

    c.font = '13px Roboto, Arial, sans-serif';
    c.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = Math.round(T + h - (h * i / 5)) + .5;
      c.strokeStyle = '#e2e2e2';
      c.beginPath(); c.moveTo(L, y); c.lineTo(L + w, y); c.stroke();
      c.fillStyle = '#555'; c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText(String(step * i), L - 8, y);
    }
    const n = Math.max(1, labels.length - 1);
    labels.forEach((lb, i) => {
      const x = Math.round(L + (w * i / n)) + .5;
      c.strokeStyle = '#e2e2e2';
      c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + h); c.stroke();
      c.fillStyle = '#555'; c.textAlign = 'center'; c.textBaseline = 'top';
      c.fillText(lb, x, T + h + 10);
    });

    if (!data.length) return;
    const px = i => L + (w * i / n);
    const py = v => T + h - (h * v / top);
    c.strokeStyle = '#659A00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath();
    data.forEach((v, i) => i ? c.lineTo(px(i), py(v)) : c.moveTo(px(i), py(v)));
    c.stroke();
    c.fillStyle = '#659A00';
    data.forEach((v, i) => { c.beginPath(); c.arc(px(i), py(v), 5, 0, Math.PI * 2); c.fill(); });
  };
  draw();
  if (window._zyChartR) window.removeEventListener('resize', window._zyChartR);
  window._zyChartR = () => { clearTimeout(window._zyChartT); window._zyChartT = setTimeout(draw, 150); };
  window.addEventListener('resize', window._zyChartR);
}

function zyDT2(id, cfg) {

    search: '', check: false, ids: [], total: null
  }, cfg);

function zyCell2(c) { return (c && typeof c === 'object') ? c : { v: c, h: c }; }

function zy2Render(id) {
  const t = ZYT2[id], host = document.getElementById(id);
  if (!t || !host) return;
  const rows = zy2Data(t);
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / t.perPage));
  const page = t.page = Math.min(t.page, pages);
  const from = total ? (page - 1) * t.perPage + 1 : 0;
  const to = Math.min(total, page * t.perPage);
  const slice = rows.slice((page - 1) * t.perPage, page * t.perPage);

  const nums = [];
  const startN = Math.max(1, Math.min(page - 2, pages - 4));
  for (let i = startN; i <= Math.min(pages, startN + 4); i++) nums.push(i);

  const head =
    (t.check ? `<th class="zy-cbcol"><input type="checkbox" onclick="zy2All('${id}',this)">${zyImg('ui_sort_asc','zy-cbsort')}</th>` : '') +
    t.cols.map((c, i) => `<th class="${i === t.sort ? 'sorted' : ''}" onclick="zy2Sort('${id}',${i})">${c}<span class="zy-sort">${i === t.sort ? (t.dir === 1 ? '▲' : '▼') : '⇅'}</span></th>`).join('');

  const body = slice.length ? slice.map((r, ri) => `<tr>` +
      (t.check ? `<td class="zy-cbcol"><input type="checkbox" class="zy-cb-${id}" value="${r.__id ?? ri}"></td>` : '') +
      r.map((c, i) => `<td class="${i === t.sort ? 'sorted' : ''}">${zyCell2(c).h ?? ''}</td>`).join('') +
      `</tr>`).join('')
    : `<tr><td class="zy-empty" colspan="${t.cols.length + (t.check ? 1 : 0)}">No data available in table</td></tr>`;

  host.innerHTML = `
    <div class="zy-dt2-top">
      <div class="zy-search"><label>Search:</label>
        ${zyImg('ui_search', 'zy-mag')}
        <input value="${t.search.replace(/"/g, '&quot;')}" oninput="zy2Search('${id}',this.value)"></div>
      <div class="zy-show">
        <select onchange="zy2Size('${id}',this.value)">
          ${[10, 25, 50, 100].map(n => `<option ${n === t.perPage ? 'selected' : ''}>${n}</option>`).join('')}
        </select>
        <div class="zy-show-lbl">Show Records:</div>
      </div>
    </div>
    <div class="zy-exp">
      <button onclick="zy2Export('${id}','copy')">Copy</button>
      <button onclick="zy2Export('${id}','csv')">CSV</button>
      <button onclick="zy2Export('${id}','excel')">Excel</button>
      <button onclick="zy2Export('${id}','pdf')">PDF</button>
      <button onclick="zy2Export('${id}','print')">Print</button>
      <button class="zy-cols" onclick="zy2Cols('${id}')">Show / hide columns</button>
    </div>
    <div class="zy-dt-wrap"><table class="zy-dt zy-dt2-table">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody>
      ${t.footRow ? `<tfoot><tr>${t.footRow}</tr></tfoot>` : ''}
    </table></div>
    <div class="zy-dt2-foot">
      <div class="zy-info">Showing ${from} to ${to} of ${total} entries</div>
      <div class="zy-pager">
        <button ${page === 1 ? 'disabled' : ''} onclick="zy2Page('${id}',1)">First</button>
        <button ${page === 1 ? 'disabled' : ''} onclick="zy2Page('${id}',${page - 1})">Previous</button>
        ${nums.map(n => `<button class="${n === page ? 'on' : ''}" onclick="zy2Page('${id}',${n})">${n}</button>`).join('')}
        <button ${page === pages ? 'disabled' : ''} onclick="zy2Page('${id}',${page + 1})">Next</button>
        <button ${page === pages ? 'disabled' : ''} onclick="zy2Page('${id}',${pages})">Last</button>
      </div>
    </div>`;
}
function zy2Sort(id, i) { const t = ZYT2[id]; if (t.sort === i) t.dir = -t.dir; else { t.sort = i; t.dir = 1; } t.page = 1; zy2Render(id); }
function zy2Page(id, p) { const t = ZYT2[id]; t.page = Math.max(1, p); zy2Render(id); }
function zy2Size(id, v) { const t = ZYT2[id]; t.perPage = parseInt(v); t.page = 1; zy2Render(id); }
function zy2Search(id, v) { const t = ZYT2[id]; t.search = v; t.page = 1; zy2Render(id); const el = document.querySelector(`#${id} .zy-search input`); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }
function zy2All(id, el) { document.querySelectorAll(`.zy-cb-${id}`).forEach(c => c.checked = el.checked); }
function zy2Checked(id) { return Array.from(document.querySelectorAll(`.zy-cb-${id}`)).filter(c => c.checked).map(c => c.value); }
function zy2Cols(id) {
  const t = ZYT2[id];
  zyModal('Show / hide columns',
    `<div class="zy-colslist">${t.cols.map((c, i) => `<label><input type="checkbox" checked disabled> ${c}</label>`).join('')}</div>`,
    `<button class="zy-btn-grey" onclick="closeModal()">Close</button>`);
}
function zy2Export(id, kind) {
  const t = ZYT2[id], rows = zy2Data(t);
  const text = [t.cols.join('\t')].concat(rows.map(r => r.map(c => String(zyCell2(c).v ?? '')).join('\t'))).join('\n');
  if (kind === 'copy') {
    navigator.clipboard && navigator.clipboard.writeText(text);
    toast('Copied ' + rows.length + ' rows', 'success'); return;
  }
  if (kind === 'csv' || kind === 'excel') {
    const csv = [t.cols.join(',')].concat(rows.map(r => r.map(c => `"${String(zyCell2(c).v ?? '').replace(/"/g, '""')}"`).join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = id + (kind === 'excel' ? '.xls' : '.csv'); a.click();
    return;
  }
  const w = window.open('', '_blank');
  w.document.write(`<table border=1 cellspacing=0 cellpadding=6><tr>${t.cols.map(c => `<th>${c}</th>`).join('')}</tr>` +
    rows.map(r => `<tr>${r.map(c => `<td>${zyCell2(c).v ?? ''}</td>`).join('')}</tr>`).join('') + `</table>`);
  w.document.close(); w.print();
}


/* ── select2-style picker (same behaviour as the source panel) ── */
const ZY_S2 = {};
function zyS2(id, placeholder, items, onPick) {
  ZY_S2[id] = { items: items || [], value: '', onPick: onPick || null, ph: placeholder };
  return `<div class="zy-s2" id="${id}">
    <div class="zy-s2-box" onclick="zyS2Toggle('${id}')"><span>${placeholder}</span>${zyImg('ui_caret')}</div>
    <div class="zy-s2-drop">
      <div class="zy-s2-search"><input placeholder="" oninput="zyS2Filter('${id}',this.value)"></div>
      <div class="zy-s2-list"></div>
    </div></div>`;
}
function zyS2Fill(id, list) {
  const host = document.querySelector(`#${id} .zy-s2-list`); if (!host) return;
  const t = ZY_S2[id];
  host.innerHTML = list.length
    ? list.map(v => `<div class="${v === t.value ? 'on' : ''}" data-v="${zyEsc(v)}" onclick="zyS2Pick('${id}',this.dataset.v)">- ${zyEsc(v)}</div>`).join('')
    : `<div class="zy-s2-none">No results found</div>`;
}
function zyS2Toggle(id) {
  const el = document.getElementById(id); if (!el) return;
  document.querySelectorAll('.zy-s2.open').forEach(o => { if (o !== el) o.classList.remove('open'); });
  el.classList.toggle('open');
  if (el.classList.contains('open')) {
    zyS2Fill(id, ZY_S2[id].items);
    const inp = el.querySelector('.zy-s2-search input'); if (inp) { inp.value = ''; inp.focus(); }
  }
}
function zyS2Filter(id, q) {
  const s = (q || '').toLowerCase();
  zyS2Fill(id, ZY_S2[id].items.filter(v => v.toLowerCase().includes(s)));
}
function zyS2Pick(id, v) {
  const t = ZY_S2[id]; t.value = v;
  const box = document.querySelector(`#${id} .zy-s2-box`);
  box.classList.add('picked'); box.querySelector('span').textContent = v;
  document.getElementById(id).classList.remove('open');
  if (t.onPick) t.onPick(v);
}
function zyS2Value(id) { return (ZY_S2[id] || {}).value || ''; }
document.addEventListener('click', e => {
  if (!e.target.closest('.zy-s2')) document.querySelectorAll('.zy-s2.open').forEach(o => o.classList.remove('open'));
});

/* ── modal in the reference panel's style ───────────────────── */
function zyModal(title, body, footer) {
  const m = document.getElementById('modal');
  m.classList.add('zy-modal');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML =
    `<div class="zy-modal-body">${body}</div>` + (footer ? `<div class="zy-modal-foot">${footer}</div>` : '');
  document.getElementById('modal-overlay').classList.add('active');
  document.getElementById('modal-overlay').style.display = 'flex';
}

const zyList = v => Array.isArray(v) ? v : ((v && v.data) || []);
const zyEsc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const zyTick = on => on ? zyImg('ui_tick', 'zy-tick') : '';

    'agents': pgAgentsList,

  const prev = loadPage;
  loadPage = function (page) {

      document.getElementById('zy-user-menu')?.classList.remove('open');

      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

/* ═══ shared filter box (dates + agent + Show Report) ═══════ */
function zyMonthStart() { const d = new Date(); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; }
function zyToday() { return new Date().toISOString().slice(0, 10); }
function zyFilterBox(id, onShow, extraBtn) {
  return `<div class="zy-filterbox">
    <input class="zy-fb-input" id="${id}-from" value="${zyMonthStart()} 00:00:00">
    <input class="zy-fb-input" id="${id}-to" value="${zyToday()} 23:59:59">
    <select class="zy-fb-input" id="${id}-agent"><option value="">Filter Agent</option></select>
    <div class="zy-fb-btns">${extraBtn || ''}
      <button class="zy-btn-blue" onclick="${onShow}">Show Report</button></div>
  </div>`;
}
async function zyFillAgents(selectId) {
  const res = await apiFetch(`/api/agents?manager_id=${MANAGER_ID}&limit=200`);
  ZY_AGENTS = (res && res.data) || [];
  const el = document.getElementById(selectId);
  if (el) el.innerHTML = `<option value="">Filter Agent</option>` +
    ZY_AGENTS.map(a => `<option value="${a.id}">${zyEsc(a.username)}</option>`).join('');
  return ZY_AGENTS;
}
const zyAgentName = id => (ZY_AGENTS.find(a => String(a.id) === String(id)) || {}).username || '';
const zyDateOnly = s => String(s || '').replace('T', ' ').slice(0, 19);
function zyInRange(id, ts) {
  const f = (document.getElementById(id + '-from') || {}).value || '';
  const t = (document.getElementById(id + '-to') || {}).value || '';
  const v = zyDateOnly(ts);
  if (f && v && v < f) return false;
  if (t && v && v > t) return false;
  return true;
}
function zyAgentFilter(id) { return (document.getElementById(id + '-agent') || {}).value || ''; }

async function pgCreditNotesLoad() {
  const body = document.getElementById('cn-body');
  body.innerHTML = `<div class="zy-loading">Loading…</div>`;
  const res = await apiFetch('/api/credit-notes?limit=500');
  const mine = new Set(ZY_AGENTS.map(a => String(a.id)));
  const pick = zyAgentFilter('cn');
  const rows = ((res && res.data) || [])
    .filter(n => mine.has(String(n.agent_id)))
    .filter(n => !pick || String(n.agent_id) === pick)
    .filter(n => zyInRange('cn', n.created || n.date))
    .map(n => {
      const due = new Date((n.date || n.created || '').slice(0, 10));
      due.setDate(due.getDate() + 1);
      return [ (n.date || n.created || '').slice(0, 10), zyAgentName(n.agent_id),
               n.term || 'Weekly', n.currency || 'USD',
               n.amount != null ? Number(n.amount).toFixed(3) : '',
               isNaN(due) ? '' : due.toISOString().slice(0, 10),
               n.status === 'confirmed' ? 'Confirmed' : (n.status || '') ];
    });
  body.innerHTML = zyDT2('dt-credit', {
    cols: ['Date', 'Agent', 'Term', 'Currency', 'Payout', 'Due Date', 'Status'], rows, sort: 0, dir: -1 });
  zy2Render('dt-credit');
}

async function pgStatements(cur) {
  const c = document.getElementById('page-content');
  zyCrumb([cur + ' Statements']);
  c.innerHTML = `<div class="zy-gap"></div>
    ${zyFilterBox('st', `pgStatementsLoad('${cur}')`)}
    <div class="zy-panel"><div class="zy-panel-head">${cur} Statements</div>
      <div class="zy-panel-body" id="st-body"><div class="zy-loading">Loading…</div></div></div>`;
  await zyFillAgents('st-agent');
  pgStatementsLoad(cur);

async function pgStatementsLoad(cur) {
  const body = document.getElementById('st-body');
  body.innerHTML = `<div class="zy-loading">Loading…</div>`;
  const res = await apiFetch('/api/credit-notes?limit=500');
  const mine = new Set(ZY_AGENTS.map(a => String(a.id)));
  const pick = zyAgentFilter('st');
  let balance = 0;
  const rows = ((res && res.data) || [])
    .filter(n => mine.has(String(n.agent_id)))
    .filter(n => (n.currency || 'USD') === cur)
    .filter(n => !pick || String(n.agent_id) === pick)
    .filter(n => zyInRange('st', n.created || n.date))
    .sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')))
    .map(n => {
      const credit = Number(n.amount || 0);
      balance = Math.round((balance + credit) * 1000) / 1000;
      return [ zyDateOnly(n.created || n.date), zyAgentName(n.agent_id),
               credit.toFixed(2), '0', 'Credit Note', balance.toFixed(2), n.reason || '' ];
    }).reverse();
  body.innerHTML = zyDT2('dt-stmt', {
    cols: ['Date', 'Agent', 'Credit', 'Debit', 'Transaction For', 'Balance', 'Remarks'], rows, sort: 0, dir: -1 });
  zy2Render('dt-stmt');
}
